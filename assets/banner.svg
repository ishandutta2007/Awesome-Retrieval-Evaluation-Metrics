<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>

    <!-- Vibrant Accents Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b72" />
      <stop offset="50%" stop-color="#d85d7f" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animation for Dynamic / Live Visuals -->
    <style>
      .pulse-dot {
        animation: pulse 2.5s infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: flow 20s linear infinite;
      }
      .float-text {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.5; filter: drop-shadow(0 0 2px #58a6ff); }
        100% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #a371f7); }
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Stylized Chart Waves (dynamic-looking paths) -->
  <path d="M 0 300 Q 150 150, 300 250 T 600 120 T 900 280 T 1200 180" fill="none" stroke="url(#accentGrad1)" stroke-width="4" filter="url(#glow)" />
  <path d="M 0 320 Q 200 220, 400 290 T 800 150 T 1200 220" fill="none" stroke="url(#accentGrad2)" stroke-width="2.5" class="dash-flow" opacity="0.8" />

  <!-- Decorative Network Nodes/Detections -->
  <circle cx="300" cy="250" r="6" fill="#ff7b72" class="pulse-dot" />
  <circle cx="600" cy="120" r="6" fill="#a371f7" class="pulse-dot" />
  <circle cx="900" cy="280" r="6" fill="#58a6ff" class="pulse-dot" />

  <!-- Branding Text & Subtitle -->
  <g class="float-text">
    <text x="50%" y="45%" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">
      RETRIEVAL EVALUATION METRICS
    </text>
    <text x="50%" y="60%" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="400" fill="#8b949e" letter-spacing="4">
      HISTORY • PROGRESSION • VARIANTS • APPLICATIONS
    </text>
  </g>

  <!-- Modern Metric Indicator Overlays (Mock UI elements) -->
  <rect x="50" y="320" width="180" height="45" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="70" y="347" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#8b949e">NDCG@10: </text>
  <text x="160" y="347" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#58a6ff">0.942</text>

  <rect x="970" y="320" width="180" height="45" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="990" y="347" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#8b949e">MRR: </text>
  <text x="1080" y="347" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ff7b72">0.875</text>
</svg>
